# The daemon. Owns no logic of its own — it wires the other crates together
# and supervises them.
[package]
name    = "nsc-live"
version.workspace = true
edition.workspace = true

[[bin]]
name = "nsc-live"
path = "src/main.rs"

[dependencies]
nsc-core     = { workspace = true }
nsc-ta       = { workspace = true }
nsc-strategy = { workspace = true }
nsc-data     = { workspace = true }
nsc-risk     = { workspace = true }
nsc-news     = { workspace = true }
nsc-ai       = { workspace = true }
nsc-chart    = { workspace = true }
nsc-telegram = { workspace = true }
tokio        = { workspace = true }
sqlx         = { workspace = true }
redis        = { workspace = true }
figment      = { workspace = true }
serde        = { workspace = true }
chrono       = { workspace = true }
uuid         = { workspace = true }
anyhow       = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
