# ── nsc_trades ─────────────────────────────────────────────────────────────
# Virtual workspace root. Owns no code itself; it pins shared dependency
# versions so every crate below agrees on one version of tokio, serde, etc.
#
# Build order of importance:
#   nsc-core     domain vocabulary        (pure)
#   nsc-ta       technical analysis       (pure)  ← the crown jewel
#   nsc-strategy your strategy, encoded   (pure)
#   everything else is plumbing around those three.
# ───────────────────────────────────────────────────────────────────────────
[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# --- internal crates -------------------------------------------------------
nsc-core     = { path = "crates/nsc-core" }
nsc-ta       = { path = "crates/nsc-ta" }
nsc-strategy = { path = "crates/nsc-strategy" }
nsc-data     = { path = "crates/nsc-data" }
nsc-risk     = { path = "crates/nsc-risk" }
nsc-news     = { path = "crates/nsc-news" }
nsc-ai       = { path = "crates/nsc-ai" }
nsc-chart    = { path = "crates/nsc-chart" }
nsc-telegram = { path = "crates/nsc-telegram" }
nsc-backtest = { path = "crates/nsc-backtest" }

# --- async runtime & web ---------------------------------------------------
tokio             = { version = "1",    features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
axum              = { version = "0.8",  features = ["macros"] }
tower-http        = { version = "0.7",  features = ["trace", "limit"] }
reqwest           = { version = "0.12", features = ["json", "rustls-tls"] }
futures           = "0.3"
async-trait       = "0.1"

# --- storage ---------------------------------------------------------------
sqlx  = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "rust_decimal", "macros"] }
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }

# --- serialisation & config ------------------------------------------------
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
figment    = { version = "0.10", features = ["toml", "env"] }
csv        = "1"

# --- domain primitives -----------------------------------------------------
chrono       = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1",   features = ["serde-with-float"] }
uuid         = { version = "1",   features = ["v4", "serde"] }

# --- errors & logging ------------------------------------------------------
anyhow            = "1"
thiserror         = "2"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- misc ------------------------------------------------------------------
teloxide  = { version = "0.17", features = ["macros"] }
plotters  = "0.3"
clap      = { version = "4", features = ["derive"] }
rayon     = "1"
