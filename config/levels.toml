# ── How thick a level's band is ─────────────────────────────────────────────
#
# A level is not a line, it is a band. These say how thick.
#
# NOT A PRICE. A share of a normal candle on that timeframe — so 0.35 gives
# about 78 points on gold and about 0.004 on EURUSD, and both look the same on
# a chart.
#
# Written as a price it would be right on one pair and wrong on every other.
# 78 points is a normal week on gold and the whole year on EURUSD.
#
# THE SAME ON EVERY PAIR. Whatever he sends, these are the thicknesses.
# ───────────────────────────────────────────────────────────────────────────

# Measured off his own weekly gold chart, 15 August 2026, from two bands he
# drew months apart at very different prices:
#
#     4132.020 - 4055.913  =  76.11   ->  0.35 of a weekly candle
#     3383.480 - 3303.553  =  79.93   ->  0.36 of a weekly candle
#
# Two independent draws landing on the same number is why this one is trusted.
weekly = 0.35

# Measured the same day, from the blue band on gold:
#
#     3000.463 - 2968.181  =  32.28   ->  0.46 of a daily candle
#
# An older note said 0.60. That came from a different set of levels on USDCAD.
# HIS OWN HAND SAYS 0.46, and his hand wins.
daily = 0.46

# NOT MEASURED. He draws 4-hour levels in yellow but none were on the chart
# used for the two above. This is a guess sitting between the other two, and
# it should be replaced the first time he sends a 4-hour level with its edges
# visible.
h4 = 0.55

# ── How close counts as arriving ────────────────────────────────────────────
#
# IN PIPS. Four of them, so the alert can say "price is COMING UP ON this zone"
# rather than only "price has touched it".
#
# A pip is worked out from each pair's `digits` — gold 0.10, the euro 0.0001 —
# so this one number is meaningful everywhere without a setting per pair.
#
# THE BAND IS STILL THE REAL EARLY WARNING, and that is why this stays small.
# Its outer edge is already a long way from the line he drew, measured against
# how fast each pair actually moves:
#
#     gold      half a weekly band  =  about 3 hours before price reaches him
#     pound     half a weekly band  =  about 6 hours
#
# An earlier version added A QUARTER OF A BAND on top of that and fired nine
# hours early on the pound, which is not an alert, it is a horoscope. Four pips
# is the last nudge before the edge, not the notice itself:
#
#     gold      0.40    =  about 2 minutes of movement
#     pound     4 pips  =  about 48 minutes
#     euro      4 pips  =  about 56 minutes
#
# ANY PAIR CAN OVERRIDE THIS with its own `approach_pips` under config/pairs/.
# Gold needs a much bigger number than the euro to feel like the same warning.
approach_pips = 4.0


# ── A graze, or a real push ─────────────────────────────────────────────────
#
# How far into a band stops being a KISS and becomes a REJECTION, as a share of
# the band's own thickness.
#
# A wick that touched the top edge and a candle that drove a third of the way
# in both "closed above". They are not the same event, and the one he acts on
# is the second.
#
# A share rather than a price, for the same reason as everything else here: 8
# points is a graze on gold and the whole band on the euro.
#
# 0.25 on his gold weekly band is about 19 points in.
kiss_depth = 0.25


# ── Which closes are worth a card ───────────────────────────────────────────
#
# ONLY WHEN THE CANDLE FINISHED OUTSIDE THE BAND. His call, 26 August 2026.
#
# A candle that touched the zone and settled INSIDE it is the most common of
# the three outcomes and the one that says least — price is there, undecided,
# and the approach alert already told him that. A card as well is the same news
# twice, and a message he stops opening is a message he misses when it matters.
#
# IT DOES NOT LOSE THE REJECTION, which is the thing that mattered. A wick into
# the zone that closed back out finishes ABOVE or BELOW the band, so it still
# sends — "a wick counts" is untouched.
#
# Set it to false to hear about every candle that touched a zone, however it
# ended. That is the old behaviour.
# ───────────────────────────────────────────────────────────────────────────
only_breaks = true
