# ═══ METALS ════════════════════════════════════════════════════════════════

# Gold. The one you actually chart.
#
# pip_size is the argument here: most platforms call 0.1 a pip on gold, some
# call 0.01 one. Check what your chart says a "pip" is worth before trusting
# the position size on a signal. The trades that fire will not change either
# way, because the rules are all in ATR.
[[symbol]]
name            = "XAUUSD"
class           = "metal"
pip_size        = 0.1
digits          = 2
# Roughly $0.50. IBKR is usually tighter than a retail CFD broker — check
# your live spread over a normal London morning and set it from what you see.
max_spread_pips = 5.0
sessions        = ["London", "NewYork"]
# It shuts for an hour every weekday at 17:00 New York and reopens at 18:00.
# Measured in the real export, not assumed: the 15-minute gold file stops at
# 20:45 UTC and restarts at 22:00 UTC on every single weekday.
daily_break_minutes = 60

# Silver.
#
# Silver moves roughly twice as hard as gold for the same news. A $20 swing
# on gold is ordinary; the same percentage move on silver looks violent.
#
# You do not have to do anything about that, and that is the point of
# measuring everything in ATR. ATR is the size of a normal candle, so silver's
# normal candle is simply bigger and every distance scales with it. Had this
# project used pip thresholds, silver would need its own set of numbers and
# they would drift out of date every time volatility changed.
[[symbol]]
name            = "XAGUSD"
class           = "metal"
pip_size        = 0.001
digits          = 3
# Roughly $0.03. VERIFY against your own feed — silver spreads widen a lot
# outside London and New York.
max_spread_pips = 30.0
sessions        = ["London", "NewYork"]
# An hour's break at 17:00 New York, the same as gold. NOT MEASURED — copied
# from gold, which was. Export a week of 15-minute candles and check before
# you trust a data report on this one.
daily_break_minutes = 60

# Copper.
#
# Do not treat this as a third precious metal. Copper is an industrial one —
# it is priced off construction, manufacturing and Chinese demand, not off
# what gold is doing. It regularly goes the opposite way to gold in the same
# week. That is why it is not in the precious_metals correlation group below.
#
# Also worth knowing: copper is thinner than the majors. Spreads widen more
# outside New York hours, and the gaps are bigger.
[[symbol]]
name            = "XCUUSD"
class           = "metal"
pip_size        = 0.0001
digits          = 4
# Roughly $0.003 per pound. VERIFY.
max_spread_pips = 30.0
sessions        = ["London", "NewYork"]
# An hour's break at 17:00 New York, the same as gold. NOT MEASURED — copied
# from gold, which was. Export a week of 15-minute candles and check before
# you trust a data report on this one.
daily_break_minutes = 60


# ═══ INDICES ═══════════════════════════════════════════════════════════════

# Dow Jones 30.
[[symbol]]
name            = "US30"
class           = "index"
# One point.
pip_size        = 1.0
digits          = 1
# 4 points. VERIFY — this is a guess at a typical spread, not your spread.
max_spread_pips = 4.0
sessions        = ["NewYork"]
# NOT MEASURED, AND PROBABLY WRONG. Equity indices settle at 16:00 New York,
# an hour before everything else here, so their break almost certainly does
# not start where app.toml says the day does. Until someone exports a week and
# looks, a data report on US30 or SPX500 will show a fault every weekday that
# is really just this setting.
daily_break_minutes = 60

# S&P 500.
[[symbol]]
name            = "SPX500"
class           = "index"
# A tenth of a point.
pip_size        = 0.1
digits          = 1
# 0.6 of a point. VERIFY.
max_spread_pips = 6.0
sessions        = ["NewYork"]
# NOT MEASURED, AND PROBABLY WRONG. Equity indices settle at 16:00 New York,
# an hour before everything else here, so their break almost certainly does
# not start where app.toml says the day does. Until someone exports a week and
# looks, a data report on US30 or SPX500 will show a fault every weekday that
# is really just this setting.
daily_break_minutes = 60


# ═══ ENERGY ════════════════════════════════════════════════════════════════

# WTI crude oil.
[[symbol]]
name            = "USOIL"
class           = "energy"
pip_size        = 0.01
digits          = 2
# 4 cents. VERIFY.
max_spread_pips = 4.0
sessions        = ["London", "NewYork"]
# An hour's break at 17:00 New York, the same as gold. NOT MEASURED — copied
# from gold, which was. Export a week of 15-minute candles and check before
# you trust a data report on this one.
daily_break_minutes = 60


# ── Instruments that are really the same bet ───────────────────────────────
# Used to stop you taking one position four times through four instruments.
# See max_per_correlation_group in risk.toml.

[correlation_groups]
usd_long  = ["USDJPY", "USDCAD", "USDCHF"]
usd_short = ["EURUSD", "GBPUSD", "AUDUSD", "NZDUSD"]
commodity = ["AUDUSD", "NZDUSD", "USDCAD"]

# US30 and SPX500 move together almost all the time. Long both is one bet in
# two accounts, and it is the easiest way to accidentally double your risk
# while believing you diversified.
us_indices = ["US30", "SPX500"]

# Gold and silver are the same trade most weeks — silver just moves harder.
# Long both is not two positions, it is one position and a half.
#
# Copper is deliberately NOT in here. It is an industrial metal priced off
# manufacturing demand, not a store of value, and it often goes the other way
# in the same week.
precious_metals = ["XAUUSD", "XAGUSD"]

# Worth considering later, once you have data rather than folklore: gold
# often rises when the dollar falls, which would put XAUUSD alongside the
# usd_short group. The relationship comes and goes depending on the year, so
# measure it on your own history before acting on it. The same goes for
# copper against the indices — both track growth, so they sometimes move as
# one bet.


# ═══════════════════════════════════════════════════════════════════════════
#  WARNING — non-forex instruments break two assumptions in this project
# ═══════════════════════════════════════════════════════════════════════════
#
#  1. THE DAILY CLOSE.  app.toml sets daily_close_anchor = 17:00 New York.
#     That is the forex convention.
#
#     It is also correct for the metals and for oil — gold, silver, copper
#     and WTI all settle at 17:00 New York and take their daily break there.
#     So those four line up with the majors and need nothing special.
#
#     It is NOT right for US30 and SPX500. Equity index futures settle an
#     hour earlier, at 16:00 New York. So the daily candles this system
#     builds for those two will not line up with the daily candles on your
#     chart — different open, different high, different low, different close.
#
#     That is not a small thing. Every level, trendline and Fibonacci anchor
#     on a daily chart is built from those candles. The bot would draw levels
#     you cannot see and miss levels you can.
#
#     The fix is a per-class daily anchor, which does not exist yet. Until it
#     does, treat daily and weekly levels on US30 and SPX500 as unreliable
#     and prefer H4 and below on those two.
#
#     CHECK THIS YOURSELF rather than trusting the paragraph above. CFD
#     hours can differ from the futures hours they are priced off. Put a
#     daily candle from this system next to the same daily candle on your
#     chart and see whether the open matches. That takes a minute and
#     settles it for good.
#
#  2. SESSIONS ARE REAL HERE.  Forex runs continuously all week. Indices and
#     oil genuinely stop, and there are gaps at the open. A gap is not a
#     candle and must not be read as one.
#
#  Neither of these has been solved in code. They are written down here so
#  that when the levels look wrong on US30, you know why before you spend an
#  evening hunting for a bug that is actually a setting.
