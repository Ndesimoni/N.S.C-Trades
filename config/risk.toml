# ── Risk and exposure ──────────────────────────────────────────────────────
# Version 1 sends signals only, so these are shown on the message and used as
# skip rules. Nothing here places a trade. The numbers still matter — they
# stop the bot flooding you with the same idea.

[account]
# Used to work out the suggested position size printed on each signal.
balance          = 10000.0
currency         = "USD"
risk_per_trade_pct = 1.0

[exposure]
max_open_signals          = 5
max_per_symbol            = 1
# The same bet taken through several pairs is one bet, not four.
max_per_correlation_group = 2

[brakes]
# How many losses in a row before the bot goes quiet and asks you to review.
max_consecutive_losses = 4
# Daily and weekly loss limits, measured in multiples of what you risk.
daily_loss_limit_r     = 3.0
weekly_loss_limit_r    = 6.0
# A tripped brake tells you rather than going silently quiet. A bot that stops
# without saying why looks exactly like one that crashed.
notify_on_brake        = true

[sizing]
# Risk a fixed percentage of the balance, worked out from the stop distance.
method = "fixed_pct"
