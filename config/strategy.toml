# ── Rung 3 — a shape, at a level ────────────────────────────────────────────
#
# ONE RULE: a shape he trades, sitting at a level he drew.
#
# Settled 25 August 2026. The reasoning is in docs/worksheets/strategies.md and
# that file is the specification — when it and the code disagree, it wins.
# ───────────────────────────────────────────────────────────────────────────

# ── How far outside a band still counts as "at" it ──────────────────────────
#
# A SHARE OF THAT BAND'S OWN THICKNESS, never a distance.
#
# Half, his answer on 25 August. Inside the band is inside — there is no depth
# rule and no touch rule. Asked whether the pin had to touch the band he said
# it need not, and that touching was no problem either, so distance is the only
# test.
#
# Written as a price it would be right on one pair and wrong on every other: a
# band on gold is about 78 points and on the euro about 0.004.
#
# WHAT IT IS MEASURED FROM is not a setting, because it is not a preference —
# a push is measured from its pin's tail tip, because the tail is the pullback
# that failed and the level is what stopped it. See shape.rs.
# ───────────────────────────────────────────────────────────────────────────
reach_of_band = "0.5"


# ── How bold a shape must be to be worth saying with no level under it ──────
#
# IN NORMAL CANDLES, on whichever candle carries the move.
#
# His words, 29 August 2026: "we see a really bold move, but it's not in our
# zone... I think we should also get an alert for that. Just for the ones that
# really show up good."
#
# WHY TWO AND NOT SOMETHING ELSE. config/patterns.toml already refuses any
# shape under one normal candle -- that is what ORDINARY means. Bold has to be
# plainly more than ordinary, and the honest step up is double. A candle twice
# the size of its neighbours is one he spots without measuring, which is his
# own test: "anyone can see it for real."
#
# Measured the same day across five pairs and both timeframes, away from his
# zones: 3.8 messages a day at 2.0, 7.5 at 1.5, and 13.8 at 1.0.
#
# THE COUNT IS THE CONSEQUENCE, NEVER THE REASON. It is written here because
# 13.8 a day would end silence-by-default, not because 3.8 is a nicer number.
#
# THIS IS NOT A SETUP AND THE CARD SAYS SO. There is no level under it, and
# nsc-bull and nsc-bear measured without levels came back at 38% -- worse than
# a coin flip. It is a remark about a candle.
# ───────────────────────────────────────────────────────────────────────────
bold_reach = "2.0"
