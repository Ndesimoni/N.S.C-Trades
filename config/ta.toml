# ── How sensitive the chart reading is ─────────────────────────────────────
# These numbers decide what the bot *sees*. Test them in the backtester. Do
# not adjust them by eye because one chart looks nicer.

[swings]
# THE most important settings in the project. Levels, trendlines, Fibonacci
# and trend direction are ALL built from swing points.
#
# NO CANDLE COUNTING. A peak is not a peak because of how many candles sit
# either side of it — that passes a lazy rounded top with twenty quiet candles
# round it, and fails a sharp turn with four. What proves a peak is what price
# did afterwards.
#
# Every number here is a SHARE OF A MOVE, never a distance. That is why the
# same four work on the 4-hour and the daily, and on gold and EURUSD.

# How much of the run must be given back for a peak to prove itself on its own.
# Half of THAT move: a 300-point rally needs about 150 back, a 60-point rally
# about 30.
confirm_retracement = 0.5
# The shallower give-back that counts once price has TAKEN THE PEAK OUT.
#
# A strong move barely pauses. Insisting on half would read structure fine in
# chop and go blind in a clean trend, which is the market worth trading. Same
# number as the strong-trend Fibonacci level below, because it is the same
# situation.
shallow_retracement = 0.382
# How big a run must be next to recent ones, or it is not a move at all.
# Without it, half of a tiny run is a tinier pullback and a quiet afternoon
# fills with swings. Range worth trying: 0.5 to 0.75. Higher means fewer,
# bigger swings.
min_run_fraction    = 0.5
# How far back "recent" reaches, counted in runs. Against only the last run the
# test ratchets down — 200, 120, 72, 43 — each passing while the chain shrinks
# to nothing. Remembering five stops that.
run_memory_legs     = 5

[levels]
# How thick a level band is, as a fraction of a normal candle.
#
# The thickness is the SAME for every level on a timeframe. The band gets slid
# up and down to catch the most touches; it never gets stretched. That is how
# the levels on your charts are drawn — see docs/worksheets/levels.md.
#
# Too thin and a wick that overshoots by a hair misses the level. Too thick
# and every price is at every level.
band_atr_multiple = 0.5
# How many touches before a band counts as a real level at all. Below this,
# nothing is drawn and nothing is reported.
#
# This is a SEEING setting, which is why it lives here: one swing point on its
# own is not a level, it is a swing point.
min_touches       = 2
# Levels older than this many candles stop being considered. Roughly three
# years of weekly candles, two years of daily, three months of 4-hour — which
# is about as far left as you look on each.
max_age_bars      = 500

# NO strong_touches HERE. It moved to strategy.toml [levels].
#
# How many touches makes a level worth trading is a trading opinion, not part
# of finding one. nsc-ta reports the touch count and stops; whether four
# touches means "well defended" or "about to break" is decided by the rules,
# where it can be switched off and measured.

[proximity]
# What counts as "price is AT the level". In normal-candle multiples, never in
# pips, because 20 pips means something completely different on GBPJPY than on
# EURUSD.
at_level_atr_multiple = 0.25

[trendlines]
min_touches          = 3      # two points make a line; three makes it real
max_violation_closes = 0      # closes past the line that break it
min_bars_between     = 5      # stops neighbouring candles making fake lines

[fibonacci]
# Drawn automatically from the most recent confirmed move.
#
# FOUR LEVELS ONLY: 0.382, 0.5, 0.618 and 0.786. Nothing else gets drawn.
#
# The zone that gets attention is 0.5 to 0.618. Price sitting between those two
# is the thing to look at.
golden_zone = [0.5, 0.618]
# For a strong trend. A strong move barely pauses, so it turns back up shallow
# — often without ever reaching the zone above. Waiting for 0.5 in a market
# like that means never getting in.
strong_trend_level = 0.382
# The third level. It is used, for something different from the zone above, and
# what that is has not been written down yet. Nothing reads it until it has a
# job — see docs/worksheets/fibonacci.md.
deep_level  = 0.786
# Used for targets. NOT confirmed yet — these are the standard numbers, not
# this trader's.
extensions  = [1.272, 1.618]

[indicators]
atr_period = 14      # this is the yardstick for every setting above
rsi_period = 14

[structure]
# TAKING AN OLD HIGH OUT IS NOT ENOUGH. Price has to cross it AND carry this
# share of the run that made it past — measured from the high itself, not from
# where the pullback started.
#
# A run from 1900 to 2100 is 200 points. At 0.4, price has to reach 2180 before
# that high counts as taken. Poke through by 5 points and stall and the high
# was touched, not taken.
#
# That poke is the most common trap on a chart: it looks like a breakout, it
# pulls buyers in, and price turns straight back down. Without this the bot
# reads it as a higher high and goes looking for a long at the worst moment.
#
# Range worth trying: 0.4 to 0.5. It is a FLOOR, not a target — carrying much
# further is the same answer arrived at more convincingly, and how far it went
# is kept on the break for the rules to weigh.
#
# Lower lows use the same number, mirrored. One rule with a direction passed
# in, because an uptrend and a downtrend judged by different rules is how a bot
# ends up bullish and bearish about the same chart on the same day.
#
# This replaces bos_atr_multiple, which measured the same thing against normal
# candle size. A share of the run is the better yardstick: what counts as real
# follow-through should change with the size of the move in front of you, not
# with how big candles happen to be this week.
min_follow_through = 0.4
