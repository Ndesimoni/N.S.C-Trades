<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>heartbeat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /*__STYLE__*/

  /* THIS ONE IS WORKED OUT, not typed. The card grows a row per pair, and a
     fixed height would either clip the last one or leave a field of white
     under four of them.

     fill.rs reads this AFTER the facts go in, which is the only reason a
     number can be put here at all. */
  :root{ --card-height:/*__TALL__*/px; }

  .w{ --level:var(--weekly) }
  .d{ --level:var(--daily) }
  .h{ --level:var(--yellow) }


  .top{
    background:var(--panel);
    padding:26px 40px 24px;
    display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
    border-bottom:1px solid var(--rule);
  }
  .top h1{
    font-family:var(--display);font-weight:800;font-size:32px;
    letter-spacing:-.02em;margin:0 0 8px;line-height:1;
    display:flex;align-items:center;gap:12px;
  }
  /* The one beat of colour on the card. Green because the whole message is
     "nothing is wrong" — and it is the only card that ever says so. */
  .beat{
    width:13px;height:13px;border-radius:50%;background:var(--up);
    box-shadow:0 0 0 5px color-mix(in srgb,var(--up) 20%,transparent);
  }
  .top p{
    margin:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--mute);
  }
  .top__right{text-align:right}
  .top__right b{
    display:block;font-family:var(--display);font-weight:600;font-size:26px;
    letter-spacing:-.02em;line-height:1;margin-bottom:8px;
  }
  .top__right span{
    font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);
  }


  .list{padding:8px 40px 0}
  .row{
    display:grid;grid-template-columns:130px 1fr auto;
    align-items:center;gap:18px;
    padding:14px 0;border-bottom:1px solid var(--grid);
  }
  .row:last-child{border-bottom:0}

  .pair{
    font-family:var(--display);font-weight:600;font-size:19px;
    letter-spacing:-.015em;
  }
  .pair span{color:var(--mute);font-weight:400;margin:0 1px}

  /* One dot per level, in the timeframe's own colour. HIS COLOURS, so a
     glance says which charts a pair is drawn on — and a pair that lost its
     daily levels shows up as a missing blue dot rather than a number that
     looks fine. */
  .dots{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .dots i{
    width:10px;height:10px;border-radius:50%;background:var(--level);
    display:block;
  }
  .dots i.h{outline:1px solid rgba(0,0,0,.18);outline-offset:-1px}

  .near{
    font-family:var(--data);font-size:13px;color:var(--mute);
    font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;
  }
  .near b{color:var(--ink);font-weight:500}
  .near u{text-decoration:none;color:var(--brass)}

  .foot{
    position:absolute;left:0;right:0;bottom:0;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 40px;border-top:1px solid var(--rule);
    font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);
  }
  .foot b{color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
  body{position:relative}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1><span class="beat"></span>Still running</h1>
    <p id="quiet"></p>
  </div>
  <div class="top__right">
    <b id="count"></b>
    <span id="stamp"></span>
  </div>
</header>

<section class="list" id="list"></section>

<footer class="foot">
  <span>This message only comes on a day nothing else did</span>
  <span id="colours"></span>
</footer>

<script>
// Rust replaces this line. Every distance is already worked out.
const beat = /*__BEAT__*/;

function draw(){
  document.getElementById("quiet").textContent =
    `Quiet since the open · ${beat.quiet_for}`;

  const zones = beat.pairs.reduce((n, p) => n + p.zones.length, 0);
  document.getElementById("count").textContent =
    `${beat.pairs.length} pair${beat.pairs.length === 1 ? "" : "s"} · ${zones} zone${zones === 1 ? "" : "s"}`;

  document.getElementById("stamp").textContent = beat.stamp;

  // Only name the colours actually on the card. A key for a timeframe he has
  // no levels on is a line of text that teaches him nothing.
  const seen = new Set(beat.pairs.flatMap(p => p.zones));
  const names = {black:"weekly", blue:"daily", yellow:"4-hour"};
  document.getElementById("colours").textContent =
    ["black","blue","yellow"].filter(c => seen.has(c)).map(c => names[c]).join(" · ");

  const short = {black:"w", blue:"d", yellow:"h"};
  const list = document.getElementById("list");

  for(const pair of beat.pairs){
    const row = document.createElement("div");
    row.className = "row";

    const dots = pair.zones
      .map(c => `<i class="${short[c]}"></i>`)
      .join("");

    // NEAREST FIRST. "Still running" is the point, but the thing worth
    // knowing on a quiet morning is which zone price is closest to — that is
    // the one likely to speak today.
    const fmt = n => n.toLocaleString("en-US",
      {minimumFractionDigits:pair.digits, maximumFractionDigits:pair.digits});

    const near = pair.near
      ? `<b>${fmt(pair.near.away)}</b> from <u>${pair.near.timeframe}</u> ${fmt(pair.near.price)}`
      : "—";

    row.innerHTML =
      `<span class="pair">${pair.symbol.replace("/", '<span>/</span>')}</span>` +
      `<span class="dots">${dots}</span>` +
      `<span class="near">${near}</span>`;

    list.appendChild(row);
  }
}

draw();
</script>
</body>
</html>
