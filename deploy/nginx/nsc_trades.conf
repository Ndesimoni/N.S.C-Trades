# Nginx reverse proxy in front of nsc-api.
#
# The only genuinely required job here is TLS: Telegram refuses to deliver
# webhooks to a plain-http endpoint. Everything else is defence in depth.

upstream nsc_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name bot.example.com;   # replace

    ssl_certificate     /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;

    # Telegram webhook. The secret-token header is verified inside nsc-api;
    # without it, anyone who learns the URL can inject fake callbacks and
    # poison your training labels.
    location /telegram/webhook {
        proxy_pass         http://nsc_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        client_max_body_size 1m;
    }

    # Admin surface: backtest triggers, signal history, the labelling tool.
    # Bind to your own IP — it can change strategy behaviour.
    location /admin/ {
        allow 127.0.0.1;
        # allow YOUR.IP.HERE;
        deny all;
        proxy_pass http://nsc_api;
    }

    location /health {
        proxy_pass http://nsc_api;
        access_log off;
    }
}

server {
    listen 80;
    server_name bot.example.com;
    return 301 https://$host$request_uri;
}
