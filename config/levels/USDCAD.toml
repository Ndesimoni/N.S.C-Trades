# ═══════════════════════════════════════════════════════════════════════════
#  USDCAD — levels drawn by hand
# ═══════════════════════════════════════════════════════════════════════════
#
#  Read off the weekly TradingView chart of 14 Aug 2026.
#
#  ── ONE PRICE, NOT A BAND ─────────────────────────────────────────────────
#
#  Each level is the price the line sits at. The band around it is worked out
#  from a normal candle on that timeframe, using `band_bands` in ta.toml.
#
#  Why the split: the thickness is the same on every chart he draws, so it is
#  a setting rather than something to write out a hundred times. And reading
#  one centre line off a screenshot is far more accurate than reading two
#  edges — about 3 points instead of 15.
#
#  ── EVERY LEVEL RUNS FORWARD ONLY ─────────────────────────────────────────
#
#  `from` is the day it was drawn, and the level does not exist before it. A
#  level drawn today knows what price did last year, so letting it act on last
#  year's candles would make a backtest look better than anything that could
#  have been traded.
#
#  A level that stops being true gets DELETED, not marked.
# ═══════════════════════════════════════════════════════════════════════════


# ── Weekly ─────────────────────────────────────────────────────────────────

[[level]]
timeframe = "W1"
price     = 1.4560
from      = 2026-08-14
