<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /*__STYLE__*/

  /*__OWN__*/
</style>
</head>
<body>

<header class="band">
  <div>
    <h1 class="band__pair" id="pair"></h1>
    <div class="band__when"><b id="interval"></b> &nbsp;·&nbsp; <span id="stamp"></span></div>
  </div>
  <div class="band__right">
    <p class="band__last" id="last"></p>
    <div class="band__move" id="move"></div>
  </div>
</header>

<div class="accent"></div>

<div class="plot">
  <svg id="chart" viewBox="0 0 860 400"></svg>
  <div class="plot__when"><span id="from"></span><span id="span"></span><span id="to"></span></div>
</div>

<footer class="strip">
  <div><div class="strip__label">Open</div><div class="strip__value" id="o"></div></div>
  <div><div class="strip__label">High</div><div class="strip__value" id="h"></div></div>
  <div><div class="strip__label">Low</div><div class="strip__value" id="l"></div></div>
  <div><div class="strip__label">Range</div><div class="strip__value" id="r"></div></div>
</footer>

<script>
// Rust replaces these two lines.
const candle = /*__CANDLE__*/;
const bars   = /*__BARS__*/;
const levels = /*__LEVELS__*/;

// How many of the LAST candles to ring, or null. The shape a signal is made of
// always finishes on the newest candle, so a count is enough and there is no
// index to get wrong across the boundary.
const ring   = /*__RING__*/;

const fmt = n => n.toLocaleString("en-US",{minimumFractionDigits:candle.digits,maximumFractionDigits:candle.digits});
const svgNS = "http://www.w3.org/2000/svg";
const make = (name, attrs) => {
  const el = document.createElementNS(svgNS, name);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
};

function bands(){
  const delta = candle.close - candle.open;
  const pct   = candle.open === 0 ? 0 : (delta / candle.open) * 100;
  const down  = delta < 0;

  document.documentElement.style.setProperty("--dir", down ? "var(--down)" : "var(--up)");

  document.getElementById("pair").innerHTML  = candle.symbol.replace("/", '<span>/</span>');
  document.getElementById("interval").textContent = candle.interval.toUpperCase();
  document.getElementById("stamp").textContent    = "CLOSED " + candle.stamp.toUpperCase();
  document.getElementById("last").textContent     = fmt(candle.close);
  document.getElementById("move").innerHTML =
    `<i>${down ? "▼" : "▲"}</i>${fmt(Math.abs(delta))} &nbsp; ${Math.abs(pct).toFixed(2)}%`;

  document.getElementById("o").textContent = fmt(candle.open);
  document.getElementById("h").textContent = fmt(candle.high);
  document.getElementById("l").textContent = fmt(candle.low);
  document.getElementById("r").textContent = fmt(candle.high - candle.low);
}

/* A round number to put a gridline on. 4,317.31 is a price; 4,350 is a level
   you can measure a distance against without doing arithmetic. */
function niceStep(range, wanted){
  const rough = range / wanted;
  const size  = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm  = rough / size;
  const pick  = [1, 2, 2.5, 5, 10].find(c => c >= norm) || 10;
  return pick * size;
}

function chart(){
  const W = 860, H = 400;
  const LEFT = 40, AXIS = 92;          // margin, and room on the right for prices

  // Empty space kept to the right of the last candle, as a share of the chart.
  // Without it the newest candle is jammed against the price axis and you
  // cannot see its shape — which is the one candle you most want to read.
  //
  // 0.18 puts it past the middle but well clear of the axis. Turn it up for
  // more room, down for more history on screen.
  const BREATHE = 0.18;

  const PLOT = W - LEFT - AXIS;
  const DRAWN = PLOT * (1 - BREATHE);
  const svg = document.getElementById("chart");

  // The scale has to hold the levels as well as the candles. A band drawn off
  // the top of the chart tells you nothing about whether it is in the right
  // place.
  const lo = Math.min(...bars.map(b => b.low),  ...levels.map(l => l.bottom));
  const hi = Math.max(...bars.map(b => b.high), ...levels.map(l => l.top));
  const pad = (hi - lo) * 0.08 || 1;
  const top = hi + pad, bottom = lo - pad;
  const y = v => (1 - (v - bottom) / (top - bottom)) * H;

  const gap = niceStep(top - bottom, 5);
  for(let p = Math.ceil(bottom / gap) * gap; p < top; p += gap){
    const gy = y(p);
    if(gy < 12 || gy > H - 12) continue;

    svg.appendChild(make("line", {
      x1:LEFT, y1:gy, x2:LEFT + PLOT, y2:gy, stroke:"var(--grid)", "stroke-width":1
    }));

    const label = make("text", {
      x:W - 40, y:gy + 4, "text-anchor":"end",
      fill:"var(--mute)", "font-size":13, "font-family":"var(--data)"
    });
    label.textContent = fmt(p);
    svg.appendChild(label);
  }

  // The levels he drew, as bands. Drawn before the candles so price sits on
  // top of them rather than being hidden.
  const paint = { black:"var(--weekly)", blue:"var(--daily)", yellow:"var(--yellow)" };

  levels.forEach(level => {
    const top = y(level.top), bottom = y(level.bottom);
    if (bottom < -20 || top > H + 20) return;      // off this chart entirely

    svg.appendChild(make("rect", {
      x:LEFT, y:top, width:PLOT, height:Math.max(bottom - top, 2),
      fill:paint[level.colour] || "var(--weekly)", opacity:0.92
    }));

    // The price on a tag at the left, ON the band — not out on the axis,
    // where it lands on top of the axis prices and both become unreadable.
    const middle = (top + bottom) / 2;
    const words = fmt(level.price);
    const wide = words.length * 7.6 + 14;

    svg.appendChild(make("rect", {
      x:LEFT + 8, y:middle - 10, width:wide, height:20, rx:3,
      fill:paint[level.colour] || "var(--weekly)"
    }));

    const tag = make("text", {
      x:LEFT + 15, y:middle + 5,
      fill:"#FFFFFF", "font-size":12.5, "font-family":"var(--data)"
    });
    tag.textContent = words;
    svg.appendChild(tag);
  });

  const step = DRAWN / bars.length;
  const bw = Math.max(1.5, step * 0.6);

  bars.forEach((b, i) => {
    const x = LEFT + step * i + step / 2;
    const tint = b.close >= b.open ? "var(--up)" : "var(--down)";

    svg.appendChild(make("line", {
      x1:x, y1:y(b.high), x2:x, y2:y(b.low),
      stroke:tint, "stroke-width":Math.max(1, bw * 0.18)
    }));

    const openY = y(b.open), closeY = y(b.close);
    svg.appendChild(make("rect", {
      x:x - bw / 2, y:Math.min(openY, closeY),
      width:bw, height:Math.max(Math.abs(closeY - openY), 1.2),
      fill:tint
    }));
  });

  // ── THE RING ──
  //
  // Red, and his own choice on 29 August 2026. It cannot be mistaken for one
  // of his levels: those are black weekly, blue daily and yellow 4-hour, and
  // none of them is ever red.
  //
  // Drawn AFTER the candles so it sits on top of them, and drawn as an outline
  // so it never hides the thing it is pointing at.
  if (ring && ring > 0 && ring <= bars.length) {
    const shape = bars.slice(-ring);

    const from = LEFT + step * (bars.length - ring);
    const to   = LEFT + step * bars.length;
    const cx   = (from + to) / 2;

    const hiY = y(Math.max(...shape.map(b => b.high)));
    const loY = y(Math.min(...shape.map(b => b.low)));
    const cy  = (hiY + loY) / 2;

    // Room around it, so the ring frames the shape rather than clipping it.
    const rx = Math.max((to - from) / 2 + 14, 22);
    const ry = Math.max((loY - hiY) / 2 + 16, 22);

    svg.appendChild(make("ellipse", {
      cx, cy, rx, ry,
      fill:"none", stroke:"#C6362F", "stroke-width":2.5, opacity:0.95
    }));
  }

  // Where the last close sits, carried across and named on the axis. Same brass
  // as the close in the readout card, so the two pictures tie together even
  // though they are separate.
  const last  = bars[bars.length - 1].close;
  const lastY = y(last);

  svg.appendChild(make("line", {
    x1:LEFT, y1:lastY, x2:LEFT + PLOT, y2:lastY,
    stroke:"var(--brass)", "stroke-width":1, "stroke-dasharray":"3 5", opacity:0.55
  }));

  svg.appendChild(make("rect", {
    x:LEFT + PLOT + 8, y:lastY - 12, width:AXIS - 48, height:24, rx:4,
    fill:"var(--brass)", opacity:0.16
  }));

  const now = make("text", {
    x:W - 40, y:lastY + 4, "text-anchor":"end",
    fill:"var(--brass)", "font-size":13.5, "font-family":"var(--data)"
  });
  now.textContent = fmt(last);
  svg.appendChild(now);

  document.getElementById("from").textContent = bars[0].at;
  document.getElementById("span").textContent = bars.length + " candles";
  document.getElementById("to").textContent   = bars[bars.length - 1].at;
}

bands();
chart();
</script>
</body>
</html>
