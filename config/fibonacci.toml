# ── Fibonacci ──────────────────────────────────────────────────────────────
#
# Recovered from the old code at a4a2170, where these numbers were settled.
#
# FOUR LEVELS ONLY: 0.382, 0.5, 0.618 and 0.786. Nothing else gets drawn. A
# level with no job attached is a line the bot draws and nothing reads.
#
# THE RATIOS ARE THE EASY PART. WHICH MOVE YOU MEASURE IS THE WHOLE GAME — the
# same ratios drawn from a different pair of points give completely different
# prices. That is why the code stores the MOVE and works the levels out from
# it, rather than storing the levels: when a Fibonacci reading looks wrong, the
# move it picked is nearly always the disagreement, and an argument about a
# move is one you can settle by looking at a chart.
# ───────────────────────────────────────────────────────────────────────────

# ── The golden zone ────────────────────────────────────────────────────────
#
# THE MOST IMPORTANT TWO. Where to look to get in: price sitting between them
# is the thing to pay attention to.
golden_zone = ["0.5", "0.618"]


# ── A reading, not an entry ────────────────────────────────────────────────
#
# NOT AN ENTRY LEVEL. A pullback this shallow means the market barely paused,
# which is what a strong trend looks like. When price turns here rather than
# reaching the zone, the information is "this move is powerful".
#
# Same number as shallow_retracement in the old [swings] block, because it is
# the same belief written once.
strong_trend = "0.382"


# ── Where stops get LOOKED AT ──────────────────────────────────────────────
#
# NOT ALWAYS, AND NEVER ON ITS OWN. Other factors come into it, so this crate
# draws the level and nsc-strategy decides whether the stop actually goes
# there.
#
# A stop placed by one line every time is a stop everybody can see.
stop_level = "0.786"


# ── Targets ────────────────────────────────────────────────────────────────
#
# NOT CONFIRMED. These are the standard numbers, not his. They stay borrowed
# until a pair of charts replaces them — the same footing the candle
# thresholds are on.
extensions = ["1.272", "1.618"]
