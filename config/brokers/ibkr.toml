# ── IBKR contract mapping ──────────────────────────────────────────────────
#
# Turns the names in symbols.toml into actual IBKR contracts.
#
# This is the ONLY file outside nsc-data::sources that mentions IBKR. Keep it
# that way. The moment broker details leak into symbols.toml or the strategy
# files, every crate depends on your broker and changing broker becomes a
# rewrite instead of one file.
#
# ── THE CONTRACTS ARE NOT VERIFIED ─────────────────────────────────────────
#
# The connection settings below are safe. The contract symbols are not — they
# are commented out because I do not know your account's product set, and a
# plausible-looking guess is worse than a blank.
#
# Look each one up properly: in TWS, right-click the instrument and choose
# Contract Info, or call reqContractDetails from the API. Paste in what it
# actually says.
#
# Why it matters: the wrong contract does not error. It downloads a real
# instrument's real history and everything works. You just backtest one
# thing while trading another, and the numbers look fine the whole way.


[connection]
# IB Gateway or TWS, running on this machine or another one.
host = "127.0.0.1"
# 4002 = IB Gateway paper, 4001 = Gateway live,
# 7497 = TWS paper,         7496 = TWS live.
# Start on paper. Version 1 places no trades, so paper is all you need.
port = 4002
# Any number, but unique per connected program. The backfill tool and the
# live bot must not share one.
client_id = 1

[pacing]
# IBKR limits history requests hard, and answers a flood with an unhelpful
# error rather than a clear one. These are deliberately cautious — backfill
# is something you run once and leave alone, so slow is fine.
max_historical_requests_per_10min = 55
min_seconds_between_identical     = 15
request_timeout_seconds           = 60

[reconnect]
# IB Gateway restarts itself once a day, around midnight New York. That is
# normal, not a fault, and the bot has to live through it.
#
# The dangerous part is not the disconnect — it is the candles that happened
# while you were away. Reconnecting without backfilling leaves a hole in your
# history that no error will ever tell you about.
auto_reconnect            = true
backfill_gap_on_reconnect = true
max_reconnect_attempts    = 0        # 0 = keep trying forever


# ═══════════════════════════════════════════════════════════════════════════
#  FOREX — cash on IDEALPRO
# ═══════════════════════════════════════════════════════════════════════════
#
#  The easy case. Cash forex is secType CASH on IDEALPRO, with the pair split
#  in two: symbol is the base currency, currency is the quote.

# [forex]
# sec_type     = "CASH"
# exchange     = "IDEALPRO"
# what_to_show = "MIDPOINT"       # MIDPOINT | BID | ASK
#
# [forex.contracts]
# EURUSD = { symbol = "EUR", currency = "USD" }
# GBPUSD = { symbol = "GBP", currency = "USD" }
# USDJPY = { symbol = "USD", currency = "JPY" }
# AUDUSD = { symbol = "AUD", currency = "USD" }
# USDCAD = { symbol = "USD", currency = "CAD" }
# USDCHF = { symbol = "USD", currency = "CHF" }
# NZDUSD = { symbol = "NZD", currency = "USD" }


# ═══════════════════════════════════════════════════════════════════════════
#  METALS, INDICES AND OIL — CFDs
# ═══════════════════════════════════════════════════════════════════════════
#
#  You trade CFDs, so this is the route for everything that is not a currency
#  pair. Two good consequences:
#
#  1. CFDs match your TradingView charts far more closely than futures do.
#  2. No expiry, so no contract rolls. That matters more than it sounds —
#     see the note at the bottom of this file.
#
#  Two things to check on your own account:
#
#  - CFD permissions are per-region. Confirm yours are enabled in Account
#    Management before planning around them.
#  - CFD price data needs its own market data subscription. Without it,
#    history requests come back empty rather than saying why.

[cfd]
sec_type     = "CFD"
exchange     = "SMART"
# CFDs have no traded volume, same as cash forex. You get MIDPOINT, BID or
# ASK — there is no TRADES.
what_to_show = "MIDPOINT"

# IBKR's CFD symbols do NOT match the retail names in symbols.toml. Their
# index CFDs use their own naming, and I am not confident enough in the exact
# strings to write them down as fact. Look each one up and replace the ???.
#
# [cfd.contracts]
# XAUUSD = { symbol = "???", currency = "USD" }
# XAGUSD = { symbol = "???", currency = "USD" }
# XCUUSD = { symbol = "???", currency = "USD" }
# US30   = { symbol = "???", currency = "USD" }
# SPX500 = { symbol = "???", currency = "USD" }
# USOIL  = { symbol = "???", currency = "USD" }

# Which route each instrument uses. Currencies go through IDEALPRO, the rest
# through CFDs.
[route]
EURUSD = "forex"
GBPUSD = "forex"
USDJPY = "forex"
AUDUSD = "forex"
USDCAD = "forex"
USDCHF = "forex"
NZDUSD = "forex"
XAUUSD = "cfd"
XAGUSD = "cfd"
XCUUSD = "cfd"
US30   = "cfd"
SPX500 = "cfd"
USOIL  = "cfd"


# ═══════════════════════════════════════════════════════════════════════════
#  NO VOLUME ANYWHERE — a real constraint, worth knowing now
# ═══════════════════════════════════════════════════════════════════════════
#
#  Cash forex has no traded volume. Neither do CFDs. Since every instrument
#  in symbols.toml is one or the other, NOTHING in this project has real
#  volume data. Not one candle.
#
#  So no rule anywhere — not in the strategy files, not in nsc-ta, not in the
#  Phase 4 model — can use volume. Not "should avoid": cannot.
#
#  Worth knowing before you write a breakout rule about volume confirming a
#  break, because that is the most natural rule in the world to want and it
#  is not available to you. Volatility and candle size can do some of the
#  same work; volume cannot do any of it.


# ═══════════════════════════════════════════════════════════════════════════
#  FUTURES — not used, kept in case you ever switch
# ═══════════════════════════════════════════════════════════════════════════
#
#  Only relevant if CFD permissions fall through. If you do end up here, the
#  thing to know is that futures contracts EXPIRE. Every few months trading
#  moves to the next month at a different price, and stitching those into one
#  series creates a jump that never happened.
#
#  That jump is invisible and it poisons exactly what this system is built
#  on: a level from before a roll sits at a price that never existed after
#  it, a trendline drawn across one has the wrong angle, and ATR over a roll
#  is enormous, so every stop goes wrong for days. None of it errors.
#
#  Choosing CFDs avoids all of that. That is the main reason it is the better
#  route here, ahead of the chart matching.
#
# [futures]
# sec_type     = "FUT"
# what_to_show = "TRADES"          # futures DO have real volume
# roll_rule    = "volume"          # volume | days_before_expiry
# roll_days_before_expiry = 5
# flag_rolls_in_data      = true   # so the backtester can refuse to draw
#                                  # a level across a roll
#
# [futures.contracts]
# XAUUSD = { symbol = "GC", exchange = "COMEX", currency = "USD" }
# XAGUSD = { symbol = "SI", exchange = "COMEX", currency = "USD" }
# XCUUSD = { symbol = "HG", exchange = "COMEX", currency = "USD" }
# SPX500 = { symbol = "ES", exchange = "CME",   currency = "USD" }
# US30   = { symbol = "YM", exchange = "CBOT",  currency = "USD" }
# USOIL  = { symbol = "CL", exchange = "NYMEX", currency = "USD" }
