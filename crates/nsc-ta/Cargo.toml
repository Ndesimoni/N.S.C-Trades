# Reads the chart. Notice there is no tokio, sqlx or reqwest here. That is
# the point: it is what lets the backtester and the live bot run the same
# analysis code.
[package]
name    = "nsc-ta"
version.workspace = true
edition.workspace = true

[dependencies]
nsc-core     = { workspace = true }
serde        = { workspace = true }
chrono       = { workspace = true }
rust_decimal = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }

# Tests only — never compiled into the library.
[dev-dependencies]
# Proves a misspelled setting in ta.toml is refused rather than ignored.
toml         = { workspace = true }
# Building a DayBoundary needs a real timezone. Not a runtime dependency:
# nsc-ta is handed the boundary already built, because reading which timezone
# to use would mean reading a config file.
chrono-tz    = { workspace = true }
