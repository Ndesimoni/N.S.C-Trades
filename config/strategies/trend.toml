# ═══════════════════════════════════════════════════════════════════════════
#  STRATEGY — TREND
# ═══════════════════════════════════════════════════════════════════════════
#
#  The trend is already going. You wait for it to pull back, and you join it.
#
#  This is the most forgiving of the three, because you are going the same
#  way as everything else on the chart. The two things that decide whether it
#  works: how you tell a pullback from a trend that has actually ended, and
#  how deep a pullback you are willing to wait for.
#
#  ── HOW TO FILL THIS IN ───────────────────────────────────────────────────
#
#  Every setting is commented out on purpose. Commented out means "not
#  decided yet", and the loader refuses to run a strategy with undecided
#  settings.
#
#  A template full of sensible-looking numbers is the most dangerous file in
#  this repo. You read 2.0, assume somebody chose it, and end up backtesting
#  a stranger's strategy.
#
#  Answer docs/worksheets/trend.md in plain words FIRST.
#
#  Everything in ATR multiples, never pips.
# ═══════════════════════════════════════════════════════════════════════════

[meta]
name    = "trend"
version = 1
enabled = false


# ── TIMEFRAMES ─────────────────────────────────────────────────────────────
# A timeframe may only ever be read at its last CLOSED candle. At 14:30 the
# 14:00–15:00 hourly candle does not exist yet.

[timeframes]
# signal_timeframes  = ["H1", "H4"]
# context_timeframes = ["W1", "D1"]


# ── 1. DIRECTION — why am I looking at this pair at all? ───────────────────
#
# Get this vague and the bot sends you a buy and a sell on the same
# instrument on the same afternoon. You will stop trusting it by week two,
# and you would be right to.

[bias]
# Which timeframe tells you the direction.
# timeframe = "D1"

# What exactly makes it bullish?
#   structure             higher highs and higher lows
#   ma_slope              price above a moving average, and the average is
#                         pointing up
#   range_position        price in the top half of the week's range
#   trendline_intact      a rising line has not been broken
# source = "structure"

# A second, independent check. Set to "none" to rely on the first alone.
# Two agreeing checks cut your signal count hard and raise the quality.
# confirm_with = "none"    # none | ma_slope | range_position | trendline_intact

# Never true in this file. If you want to trade against the trend, that is
# the reversal strategy, and it lives in its own file with its own proof.
allow_counter_trend = false

# What happens when direction is unclear — price chopping sideways, no clean
# highs and lows?
#   skip           stand aside
#   smaller_tf     drop down and trade the smaller trend
# when_unclear = "skip"

[bias.structure]
# How far past an old high price must push to count as a real break, so a
# one-pip poke does not flip your bias. See [structure] in ta.toml.
# bos_atr_multiple = 0.3

# How many higher highs and higher lows in a row before you call it a trend.
# min_swings = 2

[bias.moving_average]
# Only used if source or confirm_with mentions the moving average.
# period = 50
# type   = "ema"          # ema | sma
# The average must be sloping, not flat. Minimum slope over this many bars.
# min_slope_bars = 10


# ── 2. PLACE — how deep a pullback do I want? ──────────────────────────────
#
# You are waiting for price to come back. The question is how far back, and
# to what.

[location]
# timeframe = "H4"

# What price should pull back INTO.
#   fibonacci            the retracement zone of the last leg
#   support_resistance   a level that held before
#   trendline            the rising line under the trend
#   moving_average       the average itself acts as the floor
#   broken_level         an old ceiling that should now be a floor
# sources = ["fibonacci", "support_resistance"]

# How many of those must agree at the same price. Two separate reasons
# pointing at one price is worth far more than either one alone.
# min_confluences = 2

# The Fibonacci zone you actually trade. Defaults live in ta.toml
# [fibonacci] retracement_zone — set here only if this strategy differs.
# fib_zone = [0.382, 0.618]

# How shallow is too shallow? A pullback that barely moves has not reset
# anything and you are just buying into the same push.
# min_retracement = 0.236

# How deep is too deep? Past this, it may not be a pullback any more.
# max_retracement = 0.786

# Does it matter HOW price pulled back? A slow drifting pullback is a
# different animal from one violent candle straight back into the level.
# Most traders have never put this into words and it is usually a real
# filter.
# pullback_character = "any"      # any | corrective | impulsive

# Require the level to be one that has been defended before. Threshold lives
# in strategy.toml [levels] strong_touches, because "how many touches is a
# lot" is a trading opinion. ta.toml only counts them. More touches means
# stronger here, not worn out.
# require_strong_level = true


# ── 3. TRIGGER — what actually makes me click buy? ─────────────────────────

[trigger]
# timeframe = "H1"

# Chart patterns that mean the pullback is finishing. Available in nsc-ta:
#   flag            crates/nsc-ta/src/patterns/flag.rs
#   triangle        crates/nsc-ta/src/patterns/triangle.rs
# chart_patterns = ["flag"]

# Candlesticks. Available in nsc-ta:
#   engulfing, pin_bar, inside_bar, doji, star
# candlestick_patterns = ["engulfing", "pin_bar", "inside_bar"]

# Be exact about engulfing: measured on the body only, or the whole candle
# including the wicks? These give noticeably different results.
# engulfing_measured_on = "body"  # body | full_range

# Do you need both a shape and a candle, or is either enough?
# require = "either"      # both | either | chart_pattern_only | candle_only

# Enter on the trigger candle's close, or wait for price to come back?
# entry = "close"         # close | retest | limit_at_level

# require_close_in_direction = true

# Reject huge trigger candles — the move has mostly happened already.
# max_candle_atr_multiple = 2.0

# Is a candle enough on its own, or does something have to break first —
# the high of the pullback, a small trendline over it?
# require_micro_break = false

# What makes a trigger too late to bother with? Candles since the pullback
# reached the zone.
# max_bars_since_zone_touch = 5


# ── 4. STOP — where does it go, and why there? ─────────────────────────────
#
# Describe the rule, not a number. "Just past the swing that made the level,
# with a bit of room" is a rule. "30 pips" is not — it works on the one
# thing you tested it on.

[invalidation]
#   structure     past the swing low that the pullback made
#   trigger_wick  past the wick of the trigger candle
#   level         past the level price pulled back into
#   atr           a fixed multiple of normal candle size
# method = "structure"

# How much room, and why that much. Too tight and normal noise takes you
# out of a trade that was right.
# buffer_atr_multiple = 0.3

# Wider than this and you skip rather than accept bad risk-to-reward.
# max_stop_atr_multiple = 3.0

# too_wide_action = "skip"        # skip | reduce_size


# ── 5. TARGET — where do I get out? ────────────────────────────────────────

[target]
#   opposing_level  the next level in the way
#   fixed_r         a set multiple of what you risked
#   fib_extension   1.272 or 1.618 of the pullback
#   prior_swing     the high the trend last made
#   trailing        follow the trend until structure breaks
# method = "opposing_level"

# The worst risk-to-reward you will accept.
# min_risk_reward = 2.0

# partials = [{ at_r = 1.0, close_pct = 50 }]

# Be honest about whether this helps you or just turns winners into
# scratches. It is easy to test and most people never do.
# move_to_breakeven_at_r = 1.0


# ── 6. SKIP — what makes me pass on a setup that ticks every box? ──────────
#
# This is where your real edge probably lives. Expect it to grow more than
# any other section.

[veto]
# blocked_sessions      = ["Sydney"]
# friday_cutoff_utc     = "15:00"
# news_blackout_minutes = 30
# news_impact_levels    = ["high"]
# respect_max_spread    = true
# cooldown_bars         = 12

# ── Trend-specific skips ──
# How far the trend has already run before you stop joining it. Late in a
# move, the pullback you are buying is the start of the reversal.
# max_legs_into_trend = 4

# Refuse if a big higher-timeframe level sits just above the entry — there
# is nowhere for the trade to go.
# min_room_to_next_level_atr = 2.0

# Refuse if the pullback has already gone on longer than the push that made
# it. That is not a pullback any more, it is a fight.
# max_pullback_bars_vs_impulse = 1.0

# Refuse if the trend timeframe and the entry timeframe disagree.
# require_timeframe_agreement = true


# ── CONFIDENCE SCORING ─────────────────────────────────────────────────────
#
# The rules above decide WHETHER there is a setup. These points only decide
# how confident it is. Expect two of them to do nearly all the work.

[confluence.weights]
# fib_and_sr_overlap     = 20    # two separate reasons at one price
# golden_pocket          = 15
# trendline_confluence   = 15
# higher_tf_level_aligns = 20
# round_number_nearby    = 5
# rsi_divergence         = 15
# level_well_defended    = 10    # lots of touches, so lots of people watching
# clean_approach         = 10    # came in cleanly, not after repeated pokes
# shallow_pullback       = 10    # strong trends pull back less

[confluence.thresholds]
# minimum         = 40
# high_conviction = 70


# ── PER-TIMEFRAME OVERRIDES ────────────────────────────────────────────────
# Anything here replaces the default above, for that timeframe only.

# [tf.H4]
# [tf.H4.location]
# min_confluences = 2

# [tf.M30]
# [tf.M30.target]
# min_risk_reward = 1.5
