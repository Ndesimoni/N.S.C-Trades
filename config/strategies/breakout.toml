# ═══════════════════════════════════════════════════════════════════════════
#  STRATEGY — BREAKOUT
# ═══════════════════════════════════════════════════════════════════════════
#
#  Price has been stuck. It gets out. You go with it.
#
#  The whole difficulty of this strategy is one thing: most breaks fail.
#  Price pokes through a level, everyone piles in, and it comes straight
#  back. So nearly every setting below exists to answer the same question —
#  is this a real break, or is it a fakeout?
#
#  ── HOW TO FILL THIS IN ───────────────────────────────────────────────────
#
#  Every setting is commented out on purpose. Commented out means "not
#  decided yet", and the loader refuses to run a strategy that still has
#  undecided settings.
#
#  A template full of sensible-looking numbers is the most dangerous file in
#  this repo. You read 2.0, assume somebody chose it, and end up backtesting
#  a stranger's strategy.
#
#  Answer docs/worksheets/breakout.md in plain words FIRST. Then come here
#  and put your own numbers in.
#
#  Everything in ATR multiples, never pips.
# ═══════════════════════════════════════════════════════════════════════════

[meta]
name    = "breakout"
version = 1
enabled = false


# ── TIMEFRAMES ─────────────────────────────────────────────────────────────
# A timeframe may only ever be read at its last CLOSED candle.

[timeframes]
# signal_timeframes  = ["H1", "H4"]
# context_timeframes = ["D1"]


# ── 1. DIRECTION — why am I looking at this pair at all? ───────────────────
#
# A breakout can either go with the bigger trend or start a new one. Which
# you allow changes this from a patient strategy into a busy one.

[bias]
# timeframe = "D1"

# Must the break go the same way as the bigger trend?
#   with_trend   only breaks in the direction of the higher timeframe
#   any          take breaks in either direction
#   either_at_range_edge   with-trend anywhere, against-trend only at the
#                          edge of a big established range
# direction_rule = "with_trend"

# If the higher timeframe is going sideways, is that a reason to skip, or is
# sideways exactly when breakouts work best? Both answers are defensible.
# allow_when_higher_tf_ranging = true


# ── 2. PLACE — what exactly is being broken? ───────────────────────────────
#
# "A breakout" is not a thing on its own. Something specific has to break.

[location]
# timeframe = "H4"

# What counts as a thing worth breaking?
#   range_high, range_low       the top/bottom of a sideways stretch
#   swing_high, swing_low       the last structural high or low
#   trendline                   a drawn line
#   pattern_neckline            triangle, flag or head-and-shoulders edge
#   round_number                4,000 on gold, 1.1000 on EURUSD
#   session_high, session_low   the high/low of London or New York
#   prev_day_high, prev_day_low
# breakable = ["range_high", "range_low", "trendline"]

# How many times the level must have held before breaking. A level nobody
# defended is not a breakout, it is just price moving.
# min_touches_before_break = 2

# ── The squeeze ──
# Breakouts work best out of a tight, quiet stretch. A break out of a wide
# noisy range is mostly noise.

# Must there be a build-up before the break?
# require_consolidation = true

# How long the quiet stretch must last, in candles.
# min_consolidation_bars = 10

# How tight it must be. The range height, as a multiple of normal candle
# size. Smaller number = tighter coil = more meaningful break.
# max_consolidation_height_atr = 3.0

# Has volatility actually been dropping into the break?
# require_volatility_contraction = false


# ── 3. TRIGGER — what makes it a real break? ───────────────────────────────
#
# This is the section that decides how much of your money goes to fakeouts.

[trigger]
# timeframe = "H1"

# How far past the level counts as broken. A one-pip poke is not a break.
# Same idea as [structure] bos_atr_multiple in ta.toml.
# break_atr_multiple = 0.3

# Does the candle have to CLOSE past the level, or is a wick through enough?
# Closing is stricter, later, and wrong far less often.
# confirm_with = "close"          # close | touch

# How many candles must close past it.
# min_closes_beyond = 1

# ── Enter now, or wait for the retest? ──
#
# The biggest decision in this file.
#   immediate   enter on the breaking candle's close. Best price. Catches
#               every fakeout.
#   retest      wait for price to come back and hold the broken level. Much
#               better win rate. Misses the ones that never come back.
#   either      take the immediate entry, and take a retest entry if the
#               first one was missed.
# entry = "retest"

# If waiting for a retest: how long you wait before giving up, in candles.
# retest_max_wait_bars = 10

# How close price must come back to the broken level to count as a retest.
# retest_proximity_atr = 0.25

# Does the retest need its own candlestick confirmation, or is touching and
# holding enough?
#   Available candlesticks: engulfing, pin_bar, inside_bar, doji, star
# retest_candlestick_patterns = ["pin_bar", "engulfing"]

# Chart patterns that count as breakout shapes. Available in nsc-ta:
#   triangle        crates/nsc-ta/src/patterns/triangle.rs
#   flag            crates/nsc-ta/src/patterns/flag.rs
#   head_shoulders  crates/nsc-ta/src/patterns/head_shoulders.rs
#   double_top, double_bottom     (their necklines break too)
# chart_patterns = ["triangle", "flag"]

# Reject a breaking candle bigger than this — the move has already happened
# and your stop would be miles away.
# max_candle_atr_multiple = 2.5


# ── 4. STOP — where does it go, and why there? ─────────────────────────────

[invalidation]
#   broken_level    back on the wrong side of what just broke
#   consolidation   the other side of the range it broke out of
#   trigger_wick    past the wick of the breaking candle
#   atr             a fixed multiple of normal candle size
# method = "broken_level"

# How much room past that point.
# buffer_atr_multiple = 0.3

# Wider than this and the trade is not worth taking.
# max_stop_atr_multiple = 2.5

# too_wide_action = "skip"        # skip | reduce_size

# A break that comes straight back through the level is dead, whether or not
# your stop was hit. Do you want out at that point?
# exit_on_close_back_inside = true


# ── 5. TARGET — where do I get out? ────────────────────────────────────────

[target]
#   measured_move   the height of the range, projected from the break
#   fixed_r         a set multiple of what you risked
#   opposing_level  the next level in the way
#   fib_extension   a Fibonacci projection
# method = "measured_move"

# min_risk_reward = 2.0

# partials = [{ at_r = 1.0, close_pct = 50 }]
# move_to_breakeven_at_r = 1.0


# ── 6. SKIP — what makes me pass on a setup that ticks every box? ──────────

[veto]
# blocked_sessions      = ["Sydney"]
# friday_cutoff_utc     = "15:00"
# news_blackout_minutes = 30
# news_impact_levels    = ["high"]
# respect_max_spread    = true
# cooldown_bars         = 12

# ── Breakout-specific skips ──
# A break driven by an announcement is a different animal. Sit it out?
# skip_news_driven_breaks = true

# Refuse if there is a big higher-timeframe level sitting just above your
# entry. There is nowhere for the trade to go.
# min_room_to_next_level_atr = 2.0

# Refuse breaks in the last part of a session, when the move has no time to
# run before liquidity dries up.
# blocked_minutes_before_session_close = 60

# How many failed breaks of the same level before you stop trying.
# max_failed_breaks_per_level = 2


# ── CONFIDENCE SCORING ─────────────────────────────────────────────────────

[confluence.weights]
# tight_consolidation      = 20   # the coil was genuinely tight
# many_touches_before      = 15   # the level was well defended
# higher_tf_level_aligns   = 20
# with_higher_tf_trend     = 15
# clean_retest             = 15   # came back, held, moved away
# room_to_next_level       = 10
# round_number_nearby      = 5
# session_open_break       = 10   # broke as London or New York opened

[confluence.thresholds]
# minimum         = 40
# high_conviction = 70


# ── PER-TIMEFRAME OVERRIDES ────────────────────────────────────────────────
# Anything here replaces the default above, for that timeframe only.

# [tf.H1]
# [tf.H1.trigger]
# entry = "retest"

# [tf.H4]
# [tf.H4.trigger]
# entry = "immediate"
