# ── nsc_trades ─────────────────────────────────────────────────────────────
# The workspace root. It holds no code of its own.
#
# Its job is to pin one version of every outside library. When a second crate
# appears, it takes its versions from here rather than choosing its own — so
# two parts of the program can never end up on two versions of the same thing.
# ───────────────────────────────────────────────────────────────────────────
[workspace]
resolver = "3"
members  = ["crates/nsc-core", "crates/nsc-work-man"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]

# --- our own crates ---
nsc-core = { path = "crates/nsc-core" }

# ── Talking to the outside world ──
tokio   = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }


# Holding a line open. reqwest can only ask a question and get an answer;
# a websocket stays open and the other side pushes prices down it whenever
# it likes.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }


# Pinned exactly. 0.3.34 asks for a companion crate at the same version that
# was never published, so it cannot build. 0.3.31 is the last good pair.
futures-util = "=0.3.31"



# ── Reading what comes back ──
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Reading config/. His levels and the pair settings live in TOML because a
# trader should be able to open them, not because a program finds it easy.
toml = "0.8"

# ── Times. Everything in this project is UTC. ──
chrono = { version = "0.4", features = ["serde"] }

# ── Prices. Never f64. ──
#
# 0.1 + 0.2 is not 0.3 in floating point. On one candle nobody notices. Across
# a year of them the error piles up, and a level that should sit at 4520.00
# ends up at 4519.9999998 — so the test for "did price touch the level" starts
# answering no when your eye says yes.
rust_decimal = { version = "1", features = ["serde-with-str"] }

# ── Errors ──
#
# Binaries use anyhow: something went wrong, here is the trail, stop.
# Libraries will use thiserror: a named error the caller can act on, because
# a bad API key and a dropped connection need opposite responses.
anyhow    = "1"
thiserror = "2"

# Trimming the screenshot. Chrome's headless mode always leaves a strip of
# white below the page, and the mode that did not do that has been removed from
# Chrome, so the strip gets cut off afterwards.
image = { version = "0.25", default-features = false, features = ["png"] }

# ── Secrets, kept out of the code ──
dotenvy = "0.15"
