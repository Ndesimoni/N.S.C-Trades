# ═══════════════════════════════════════════════════════════════════════════
#  STRATEGY REGISTRY
# ═══════════════════════════════════════════════════════════════════════════
#
#  This file does NOT contain trading rules. Your rules live in one file per
#  strategy, in config/strategies/.
#
#      reversal.toml   catching a turn once the trend runs out of strength
#      breakout.toml   price escapes a range and you go with it
#      trend.toml      the trend is running, you buy the pullback
#
#  Why separate files: three strategies in one file turn into one strategy
#  with thirty exceptions. You lose the ability to switch one off, backtest
#  one on its own, or find out that two of them are quietly the same trade.
#
#  What THIS file decides is everything that only makes sense once you have
#  more than one strategy:
#
#      - which ones are switched on
#      - which timeframes exist and which way context flows
#      - what happens when two strategies fire on the same instrument at once
#      - how the same idea is stopped from being sent to you twice
#
#  Any strategy with settings still commented out will refuse to load. That
#  is deliberate. Half a strategy is worse than none, because it looks like
#  a whole one in the results.
# ═══════════════════════════════════════════════════════════════════════════

[registry]
# Files are loaded from config/strategies/. Each one has its own `enabled`
# flag as well — both must be true for it to run.
#
# Switch them on ONE AT A TIME. Turning on two at once means you cannot tell
# which one changed your results.
strategies = ["reversal", "breakout", "trend"]


# ── TIMEFRAMES ─────────────────────────────────────────────────────────────
#
# Not set here. Which timeframes exist, which ones fire signals and which
# order they are evaluated in all live in app.toml:
#
#     [engine]   derived                 which timeframes get built
#     [schedule] signal_timeframes       which ones fire signals
#     [schedule] evaluate_largest_first  the order when several close at once
#
# One fact, one place. Two files both listing your timeframes is how they
# end up disagreeing, and the disagreement shows up as signals that fire in
# the backtester and never fire live.
#
# An individual strategy file can narrow that list — reversal.toml may say
# it only fires on H4 — but it can never add a timeframe that app.toml has
# not switched on.
#
# THE RULE THAT MATTERS, wherever timeframes are read: context is stamped
# with the candle that produced it, and a smaller timeframe may only read
# context stamped at or before the candle it is currently on.
#
# At 14:30 the 30-minute candle closes. The 14:00–15:00 hourly candle is
# half finished — it does not exist yet. The 30-minute check reads the
# hourly context stamped 14:00, produced by the 13:00–14:00 candle that
# actually closed.
#
# Break this and your backtest gets BETTER while your live results do not
# match, and you will never spot it from the numbers.


# ── WHEN TWO STRATEGIES FIRE AT ONCE ───────────────────────────────────────
#
# This will happen constantly, and it is a trading decision, not a technical
# one. A level breaking is a breakout signal AND the end of a range for the
# reversal strategy. Both are looking at the same candle.
#
# Leave this undecided and the bot sends you a buy and a sell on gold in the
# same minute.

[conflict]
# When two strategies fire on the same instrument in the SAME direction —
# that is one trade seen twice, not two trades.
#   highest_confidence   send the one scoring higher
#   priority             send whichever is first in `priority` below
#   merge                one signal, listing both reasons
# same_direction = "merge"

# When two fire on the same instrument in OPPOSITE directions.
#   skip_both            send nothing. The chart is unclear, so stand aside.
#   priority             the higher-priority strategy wins
#   highest_confidence   the higher score wins
#
# skip_both is the honest answer and the one to start with. If your own
# rules disagree with each other, that is information — it means the setup
# is not as clean as either strategy thinks.
# opposite_direction = "skip_both"

# Used when either rule above is set to "priority". First wins.
# priority = ["reversal", "breakout", "trend"]


# ── STOPPING THE SAME IDEA ARRIVING TWICE ──────────────────────────────────
#
# Price hits one level and the 30-minute, 1-hour and 4-hour all fire around
# it. That is one trade, not three. Without this you get three messages and
# you will either take three positions or stop reading the messages.

[deduplication]
# Two signals count as the same idea if they are on the same instrument, the
# same direction, and their entries are within this much of each other.
# same_level_atr = 0.5

# ...and they arrived within this many minutes of each other.
# window_minutes = 240

# Which one you get when they collide.
#   first        the one that arrived first
#   highest_tf   the one from the biggest timeframe
#   best_rr      the one with the best risk-to-reward
# keep = "highest_tf"


# ── WHICH DAYS YOU TRADE AT ALL ────────────────────────────────────────────
#
# Days the system produces nothing. No signals, no setups, nothing stored as
# a missed opportunity — the rules simply are not run.
#
# This sits above all three strategies and none of them can overrule it. A
# strategy file can be stricter in its own [veto] (say, no breakouts on a
# Wednesday) but it can never switch a blocked day back on.
#
# WHICH "MONDAY"? The trading day, not the calendar day. The trading day is
# anchored to daily_close_anchor in app.toml — 17:00 New York. So the
# trading Monday starts Sunday evening New York time, which is still Sunday
# on a calendar. Using the calendar day instead would let Sunday-evening
# signals through and block an hour of Tuesday that you meant to trade.

[trading_window]
# Days with no signals at all.
blocked_weekdays = ["Monday", "Tuesday"]


# ── LIMITS ACROSS EVERYTHING ───────────────────────────────────────────────
#
# These sit above all three strategies. A strategy cannot overrule them.

[limits]
# Most signals you want to receive in a day, across everything. A bot that
# sends fifteen messages gets muted, and a muted bot has no edge at all.
# max_signals_per_day = 5

# Most per instrument per day.
# max_signals_per_symbol_per_day = 2

# After a signal on an instrument, ignore that instrument for this many
# minutes regardless of which strategy fires.
# global_cooldown_minutes = 120


# ── REJECTED SETUPS ────────────────────────────────────────────────────────
#
# A setup that fails is not thrown away. It is stored with the layer that
# rejected it.
#
# Those rows answer "why did nothing fire this week?" — and they are the
# "do not take this" examples the Phase 4 model needs. You cannot go back
# and collect them later.

[rejections]
store = true
# Store setups that failed at the very first layer too. Far more rows, but
# without them you cannot tell "nothing was close" from "eleven setups were
# one candle away".
store_early_rejections = true
