<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>alert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /*__STYLE__*/

  /*__OWN__*/
</style>
</head>
<body>

<header class="top">
  <div>
    <h1 class="top__pair" id="pair"></h1>
    <div class="top__level">
      <span class="dot"></span>
      <span id="which"></span>
    </div>
  </div>
  <div class="top__right">
    <span class="chip" id="chip"></span>
    <span class="top__stamp" id="stamp"></span>
  </div>
</header>

<section class="body">
  <div>
    <p class="label">Price now</p>
    <p class="now" id="now"></p>
    <p class="gap" id="gap"></p>
    <p class="say" id="say"></p>
  </div>
  <svg class="zone" id="zone" aria-hidden="true"></svg>
</section>

<footer class="foot">
  <span>An alert — no entry, no stop, no target</span>
  <span>Fires <b id="range"></b> &nbsp;·&nbsp; <span id="unit"></span></span>
</footer>

<script>
// Rust replaces this line. EVERY PRICE HERE IS ALREADY WORKED OUT — this file
// decides where things sit on the card and nothing else.
const alert = /*__ALERT__*/;

const fmt = n => n.toLocaleString("en-US",
  {minimumFractionDigits:alert.digits, maximumFractionDigits:alert.digits});

function draw(){
  document.body.classList.add("is-" + alert.colour);

  const inside = alert.state === "inside";

  document.getElementById("pair").innerHTML = alert.symbol.replace("/", '<span>/</span>');
  document.getElementById("which").innerHTML =
    `${alert.timeframe} level &nbsp;<b>${fmt(alert.level)}</b>`;

  // THREE states, not two. "already" means nobody watched it happen — price
  // may have walked in during Monday's silence, and calling that an arrival
  // would put a Monday move on a Tuesday clock.
  const chip = document.getElementById("chip");
  const state = alert.already
    ? (inside ? "already in the zone" : "already at the zone")
    : (inside ? "in the zone"         : "approaching");

  chip.textContent = state;

  if(inside || alert.already) chip.classList.add("is-inside");
  if(alert.already) chip.classList.add("is-found");

  document.getElementById("stamp").textContent = alert.stamp;
  document.getElementById("now").textContent   = fmt(alert.price);

  document.getElementById("gap").innerHTML = inside
    ? `inside &nbsp;<u>·</u>&nbsp; ${fmt(alert.from_line)} from your line`
    : `${fmt(alert.gap)} from the zone`;

  document.getElementById("say").innerHTML = alert.note;

  // The graphic already carries the zone's top and bottom. Repeating them in
  // the footer spends the last line of the card on nothing.
  document.getElementById("range").textContent = `${fmt(alert.reach)} outside the zone`;
  document.getElementById("unit").textContent  = alert.unit;

  zone(inside);
}

// ── the zone, drawn to scale ──────────────────────────────────────────────
//
// The measured one. The pictogram says WHAT is happening; this says how far.
function zone(inside){
  const W = 340, H = 286, PAD = 18;
  const svg = document.getElementById("zone");
  svg.setAttribute("width", W);
  svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  const thick = alert.top - alert.bottom;
  let lo = Math.min(alert.bottom, alert.price) - thick * 0.22;
  let hi = Math.max(alert.top,    alert.price) + thick * 0.22;
  if(hi === lo){ hi += 1; lo -= 1; }

  const y = v => PAD + (1 - (v - lo) / (hi - lo)) * (H - PAD * 2);

  const BAR_L = 8, BAR_R = 128, LEAD_R = 162, TEXT_L = 172;
  const add = (tag, attrs, text) => {
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for(const k in attrs) el.setAttribute(k, attrs[k]);
    if(text !== undefined) el.textContent = text;
    svg.appendChild(el);
    return el;
  };

  const boxTop = y(alert.top), boxHigh = y(alert.bottom) - y(alert.top);
  add("rect", {class:"fill",  x:BAR_L, y:boxTop, width:BAR_R - BAR_L, height:boxHigh, rx:3});
  add("rect", {class:"spine", x:BAR_L, y:boxTop, width:4, height:boxHigh, rx:2});

  // Where the alert fires, only on the side price came from — so the card
  // answers "why now?" without a word of explanation.
  if(!inside){
    const at = alert.price > alert.top ? alert.top + alert.reach
                                       : alert.bottom - alert.reach;
    add("line", {class:"trigger", x1:BAR_L, y1:y(at), x2:BAR_R + 10, y2:y(at)});
  }

  add("line", {class:"edge", x1:BAR_L, y1:y(alert.top),    x2:BAR_R, y2:y(alert.top)});
  add("line", {class:"edge", x1:BAR_L, y1:y(alert.bottom), x2:BAR_R, y2:y(alert.bottom)});
  add("line", {class:"line", x1:BAR_L, y1:y(alert.level),  x2:BAR_R, y2:y(alert.level)});

  const rows = [
    {tag:"TOP",  value:alert.top,    now:false},
    {tag:"LINE", value:alert.level,  now:false},
    {tag:"LOW",  value:alert.bottom, now:false},
    {tag:"NOW",  value:alert.price,  now:true},
  ].sort((a,b) => b.value - a.value);

  // Labels crowd when price sits right on an edge. Push them apart, keeping
  // the order, then pull the whole run back inside the box.
  const GAP = 40;
  const ys = rows.map(r => y(r.value));
  for(let i = 1; i < ys.length; i++)
    if(ys[i] - ys[i-1] < GAP) ys[i] = ys[i-1] + GAP;
  const over = ys[ys.length-1] - (H - 12);
  if(over > 0) for(let i = ys.length-1; i >= 0; i--){
    ys[i] -= over;
    if(i > 0 && ys[i] - ys[i-1] >= GAP) break;
  }
  ys.forEach((v,i) => ys[i] = Math.max(14, Math.min(H - 8, v)));

  rows.forEach((r,i) => {
    const at = y(r.value);
    add("path", {class:"lead" + (r.now ? " is-now" : ""),
                 d:`M${BAR_R} ${at} H${BAR_R + 14} L${LEAD_R - 8} ${ys[i]} H${LEAD_R}`});

    if(r.now){
      add("circle", {class:"halo", cx:BAR_R, cy:at, r:9});
      add("circle", {class:"mark", cx:BAR_R, cy:at, r:4});
    }

    add("text", {class:"tag" + (r.now ? " is-now" : ""), x:TEXT_L, y:ys[i] - 7}, r.tag);
    add("text", {class:r.now ? "is-now" : "",            x:TEXT_L, y:ys[i] + 11}, fmt(r.value));
  });
}

draw();
</script>
</body>
</html>
