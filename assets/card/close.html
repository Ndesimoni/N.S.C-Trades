<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>close</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /*__STYLE__*/

  /*__OWN__*/
</style>
</head>
<body>

<header class="top">
  <div>
    <h1 class="top__pair" id="pair"></h1>
    <div class="top__level">
      <span class="dot"></span>
      <span id="which"></span>
    </div>
  </div>
  <div class="top__right">
    <span class="chip" id="chip"></span>
    <span class="top__stamp" id="stamp"></span>
  </div>
</header>

<section class="body">
  <div>
    <p class="label" id="what"></p>
    <p class="close" id="c"></p>
    <p class="move" id="move"></p>

    <div class="ohl">
      <div><span>O</span><b id="o"></b></div>
      <div><span>H</span><b id="h"></b></div>
      <div><span>L</span><b id="l"></b></div>
    </div>

    <p class="say" id="say"></p>
  </div>
  <svg class="zone" id="zone" aria-hidden="true"></svg>
</section>

<footer class="foot">
  <span id="what-it-is">A close, not a signal — no entry, no stop, no target</span>
  <span>Reached <b id="deep"></b> into the zone</span>
</footer>

<script>
// Rust replaces this line. EVERY PRICE IS ALREADY WORKED OUT.
const close = /*__CLOSE__*/;

const fmt = n => n.toLocaleString("en-US",
  {minimumFractionDigits:close.digits, maximumFractionDigits:close.digits});

function draw(){
  document.body.classList.add("is-" + close.colour);

  const down = close.close < close.open;
  document.documentElement.style.setProperty("--dir", down ? "var(--down)" : "var(--up)");

  document.getElementById("pair").innerHTML = close.symbol.replace("/", '<span>/</span>');

  // THE CANDLE FIRST, THEN THE LEVEL IT HAPPENED AT. Two timeframes live on
  // this card -- the candle's and the zone's -- and the level's used to sit
  // alone in this slot, under the pair, next to the coloured dot. So a 5
  // minute candle at a daily zone read as a daily candle at a glance, which is
  // the one thing the card must not be wrong about.
  document.getElementById("which").innerHTML =
    `<b>${close.interval}</b> candle &nbsp;·&nbsp; ${close.timeframe} level &nbsp;<b>${fmt(close.level)}</b>`;

  // THE ACTION, not just where it ended. A wick that grazed the edge and a
  // candle that drove a third of the way in both "closed above".
  const chip = document.getElementById("chip");
  chip.textContent = close.forming ? `so far · ${close.action}` : close.action;

  if(close.forming){
    chip.classList.add("is-forming");
  } else {
    if(close.did !== "inside") chip.classList.add("is-out");
    if(close.did === "missed") chip.classList.add("is-miss");
  }

  document.getElementById("stamp").textContent = close.stamp;
  document.getElementById("what").textContent =
    close.forming ? `${close.interval} candle · still running` : `${close.interval} close`;
  document.getElementById("say").textContent = close.note;

  if(close.forming){
    document.getElementById("what-it-is").textContent =
      "Still running — not a close, and never a signal";
  }

  document.getElementById("c").textContent = fmt(close.close);
  document.getElementById("o").textContent = fmt(close.open);
  document.getElementById("h").textContent = fmt(close.high);
  document.getElementById("l").textContent = fmt(close.low);

  document.getElementById("move").innerHTML =
    `${down ? "▼" : "▲"} ${fmt(Math.abs(close.close - close.open))} ` +
    `&nbsp;<u>·</u>&nbsp; range ${fmt(close.high - close.low)}`;
  zone();
  document.getElementById("deep").textContent = close.deep_words;
}

// ── the candle, drawn inside the zone, to scale ───────────────────────────
//
// The measured one. The pictogram on the left says WHAT happened; this says
// how far, how big, and where exactly — and a wick deep into the band with
// the body closing back out is a rejection at a glance.
function zone(){
  const W = 340, H = 300, PAD = 20;
  const svg = document.getElementById("zone");
  svg.setAttribute("width", W);
  svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  // ZOOMED TO THE CANDLE, not to the band.
  //
  // A 1-hour candle inside a weekly zone can be a hundredth of its height.
  // Drawn to the band's scale it is a smudge, and a smudge says nothing about
  // what it did — which is the only thing this card is for.
  //
  // So the view is the candle plus room around it, exactly like zooming in on
  // his own chart. The band is still true; there is just more of it than fits,
  // and whatever falls off the edge gets an arrow saying which way and how far.
  const span = Math.max(close.high - close.low, (close.top - close.bottom) * 0.004);
  const mid  = (close.high + close.low) / 2;
  let lo = mid - span * 1.6;
  let hi = mid + span * 1.6;

  // Keep HIS LINE in view whenever it is anywhere close. It is the thing the
  // candle is being judged against, and a picture of a candle with no line in
  // it answers nothing.
  if(close.level > lo - span * 3 && close.level < hi + span * 3){
    lo = Math.min(lo, close.level - span * 0.5);
    hi = Math.max(hi, close.level + span * 0.5);
  }
  if(hi === lo){ hi += 1; lo -= 1; }

  const y = v => PAD + (1 - (v - lo) / (hi - lo)) * (H - PAD * 2);
  const inView = v => v >= lo && v <= hi;

  const BAR_L = 8, BAR_R = 128, CANDLE_X = 96, LEAD_R = 162, TEXT_L = 172;
  const add = (tag, attrs, text) => {
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for(const k in attrs) el.setAttribute(k, attrs[k]);
    if(text !== undefined) el.textContent = text;
    svg.appendChild(el);
    return el;
  };

  // The band, clipped to what is on screen.
  const bandTop = y(Math.min(close.top, hi)), bandBot = y(Math.max(close.bottom, lo));
  if(close.bottom < hi && close.top > lo){
    add("rect", {class:"fill",  x:BAR_L, y:bandTop, width:BAR_R - BAR_L,
                 height:Math.max(bandBot - bandTop, 1), rx:3});
    add("rect", {class:"spine", x:BAR_L, y:bandTop, width:4,
                 height:Math.max(bandBot - bandTop, 1), rx:2});
  }

  for(const edge of [close.top, close.bottom])
    if(inView(edge))
      add("line", {class:"edge", x1:BAR_L, y1:y(edge), x2:BAR_R, y2:y(edge)});

  if(inView(close.level))
    add("line", {class:"line", x1:BAR_L, y1:y(close.level), x2:BAR_R, y2:y(close.level)});

  // Anything off screen gets an arrow, so the card never quietly hides the
  // thing the candle is being judged against.
  const away = [
    {name:"top",       at:close.top},
    {name:"your line", at:close.level},
    {name:"bottom",    at:close.bottom},
  ].filter(m => !inView(m.at));

  away.forEach((m, i) => {
    const up = m.at > hi;
    const edgeY = up ? 11 + i * 15 : H - 5 - (away.length - 1 - i) * 15;
    add("text", {class:"far", x:BAR_L, y:edgeY},
        `${up ? "↑" : "↓"} ${m.name} ${fmt(m.at)}`);
  });

  add("line", {class:"wick", x1:CANDLE_X, y1:y(close.high), x2:CANDLE_X, y2:y(close.low)});

  // THE PART THAT WENT IN, picked out. How deep it reached is the difference
  // between a graze and a rejection, and here it is a length rather than a
  // percentage in the footer.
  const inTop = Math.min(close.high, close.top), inBot = Math.max(close.low, close.bottom);
  if(inTop > inBot)
    add("line", {class:"wick is-in", x1:CANDLE_X, y1:y(inTop), x2:CANDLE_X, y2:y(inBot)});

  const bodyTop = Math.min(y(close.open), y(close.close));
  add("rect", {class:"candle" + (close.forming ? " is-forming" : ""),
               x:CANDLE_X - 13, y:bodyTop, width:26,
               height:Math.max(Math.abs(y(close.close) - y(close.open)), 3), rx:2});

  const rows = [
    {tag:"HIGH",  value:close.high,  is:false},
    {tag:"CLOSE", value:close.close, is:true},
    {tag:"LOW",   value:close.low,   is:false},
  ].sort((a,b) => b.value - a.value);

  const GAP = 42;
  const ys = rows.map(r => y(r.value));
  for(let i = 1; i < ys.length; i++)
    if(ys[i] - ys[i-1] < GAP) ys[i] = ys[i-1] + GAP;
  const over = ys[ys.length-1] - (H - 12);
  if(over > 0) for(let i = ys.length-1; i >= 0; i--){
    ys[i] -= over;
    if(i > 0 && ys[i] - ys[i-1] >= GAP) break;
  }
  ys.forEach((v,i) => ys[i] = Math.max(14, Math.min(H - 8, v)));

  rows.forEach((r,i) => {
    add("path", {class:"lead" + (r.is ? " is-close" : ""),
                 d:`M${BAR_R} ${y(r.value)} H${BAR_R + 14} L${LEAD_R - 8} ${ys[i]} H${LEAD_R}`});
    add("text", {class:"tag" + (r.is ? " is-close" : ""), x:TEXT_L, y:ys[i] - 7}, r.tag);
    add("text", {class:r.is ? "is-close" : "",            x:TEXT_L, y:ys[i] + 11}, fmt(r.value));
  });
}

draw();
</script>
</body>
</html>
