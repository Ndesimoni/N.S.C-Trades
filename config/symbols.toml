# ── What to watch ──────────────────────────────────────────────────────────
# Start small. Every instrument you add is another set of results to read and
# another way to fool yourself that something works. Add more only once the
# numbers justify it.
#
# This file is broker-neutral on purpose. It says what an instrument IS, not
# how to fetch it. The mapping from these names to actual broker contracts
# lives in config/brokers/ibkr.toml, and only nsc-data::sources reads it.
#
# Why: nothing outside nsc-data::sources is supposed to know which broker you
# use. Put IBKR contract IDs in here and every crate that reads symbols now
# depends on your broker — and swapping brokers becomes a rewrite instead of
# one file.
#
# ── The fields ──
#
# class            forex | metal | index | energy
#                  Decides which assumptions apply. See the warning at the
#                  bottom of this file — it is not decoration.
#
# pip_size         The unit stop distances and spreads are counted in. On
#                  EURUSD that is 0.0001. On an index it is one point.
#
#                  This matters LESS than it looks. Every rule in this system
#                  is measured in ATR — the size of a normal candle — so a
#                  wrong pip_size does not change which trades fire. It
#                  changes the position size printed on the message. Still
#                  worth getting right, just not load-bearing.
#
# digits           Decimal places, for rounding on display only.
#
# max_spread_pips  A skip rule. If the live spread is wider than this, the
#                  setup gets dropped no matter how good it looks.
#
# sessions         When this instrument is worth trading. Session times are
#                  not yet defined anywhere — see docs/map.md, known gaps.


# ═══ FOREX — the seven majors ══════════════════════════════════════════════

[[symbol]]
name            = "EURUSD"
class           = "forex"
pip_size        = 0.0001
digits          = 5
max_spread_pips = 2.0
sessions        = ["London", "NewYork"]
# Spot forex never shuts mid-week. It runs straight through from Sunday
# evening to Friday evening, so a missing candle is always a fault.
daily_break_minutes = 0

